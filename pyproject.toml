[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-window-lab"
version = "0.1.0"
description = "Distributed task execution across expiring idempotency windows"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<9",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running PostgreSQL and Redis",
]
